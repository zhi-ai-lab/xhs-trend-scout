name: XHS Trend Scout

on:
  push:
    branches: [main]
    paths-ignore:
      - "verification/**"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xhs-trend-scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan XHS Explore and upload sample
        id: scan
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_DETAILS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_DETAILS_FOLDER_ID }}
        run: |
          set +e
          npm run scan > /tmp/xhs-scan.log 2>&1
          status=$?
          reason="success"
          if [ "$status" -ne 0 ]; then
            if grep -q "GOOGLE_DRIVE_DETAILS_FOLDER_ID is not configured" /tmp/xhs-scan.log; then
              reason="missing_folder_secret"
            elif grep -q "GOOGLE_SERVICE_ACCOUNT_JSON is not configured" /tmp/xhs-scan.log; then
              reason="missing_service_account_secret"
            elif grep -q "GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON" /tmp/xhs-scan.log; then
              reason="invalid_service_account_json"
            elif grep -q "XHS_VERIFICATION_BLOCKED" /tmp/xhs-scan.log; then
              reason="xhs_verification_blocked"
            elif grep -q "XHS_FEED_NOT_VISIBLE_AFTER_DISMISS" /tmp/xhs-scan.log; then
              reason="xhs_feed_not_visible_after_dismiss"
            elif grep -q "XHS_SELECTOR_MISMATCH" /tmp/xhs-scan.log; then
              reason="xhs_selector_mismatch"
            elif grep -q "XHS_NO_CARDS" /tmp/xhs-scan.log; then
              reason="xhs_no_cards"
            elif grep -Eqi "storageQuota|storage quota|Service Accounts do not have storage quota" /tmp/xhs-scan.log; then
              reason="drive_storage_quota"
            elif grep -Eqi "insufficientFilePermissions|permission denied|insufficient permissions|forbidden" /tmp/xhs-scan.log; then
              reason="drive_permission"
            elif grep -Eqi "File not found|notFound|404" /tmp/xhs-scan.log; then
              reason="drive_folder_not_visible"
            elif grep -Eqi "timeout|Timeout" /tmp/xhs-scan.log; then
              reason="browser_or_page_timeout"
            else
              reason="other_scan_error"
            fi
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record verification result
        if: always()
        run: |
          mkdir -p verification
          {
            echo "workflow=XHS Trend Scout"
            echo "commit=$GITHUB_SHA"
            echo "scan_outcome=${{ steps.scan.outcome }}"
            echo "failure_reason=${{ steps.scan.outputs.reason }}"
            echo "recorded_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > verification/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/last-run.txt
          git commit -m "Record XHS verification result" || true
          git push

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-scout-output-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail workflow if scan failed
        if: steps.scan.outcome != 'success'
        run: exit 1
