name: XHS Trend Scout

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xhs-trend-scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan XHS Explore and upload sample
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_DETAILS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_DETAILS_FOLDER_ID }}
        run: npm run scan

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-scout-output-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
